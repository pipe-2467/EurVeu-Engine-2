name: EurVeu Automatic Ingestion & Neural Render

on:
  repository_dispatch:
    types: [start_eurveu_render]
  workflow_dispatch:
  push:
    paths:
      - 'EurVeu-Engine/inputs/**'

permissions:
  contents: write

jobs:
  process_and_render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache PyTorch Dependencies & Neural Weights
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
          key: ${{ runner.os }}-pytorch-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pytorch-

      - name: Install System FFmpeg & Deep Learning Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy soundfile imageio imageio-ffmpeg pillow

      - name: Purge Legacy Artifacts & Ensure Input Directory Exists
        run: |
          rm -f EurVeu-Engine/eurveu_farland_output.mp4
          mkdir -p EurVeu-Engine/inputs
          touch EurVeu-Engine/inputs/.gitkeep

      - name: Execute EurVeu Neural Deep Engine Pipeline
        run: |
          cd EurVeu-Engine
          python eurveu_core.py

      - name: Commit Memory Evolution & Clean Sensory Inputs safely
        run: |
          git config --global user.name "EurVeu-Neural-Brain"
          git config --global user.email "eurveu-brain@engine.local"
          
          # ดึงข้อมูลล่าสุดโดยเน้นเอาเวอร์ชันบน Remote เป็นหลักเพื่อกัน Conflict
          git fetch origin main
          git reset --soft origin/main || true
          
          # ลบไฟล์ภาพอินพุตหลังจากประมวลผลเสร็จแล้ว แต่รักษาโฟลเดอร์และไฟล์ .gitkeep ไว้
          mkdir -p EurVeu-Engine/inputs
          find EurVeu-Engine/inputs/ -type f ! -name '.gitkeep' -delete
          touch EurVeu-Engine/inputs/.gitkeep
          
          git add EurVeu-Engine/eurveu_memory.json EurVeu-Engine/inputs/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "[EurVeu Neural Engine] Deep Render Completed & Experiential Memory Evolved"
            git push origin main --force-with-lease || (git pull origin main --rebase && git push origin main)
          else
            echo "No state changes to commit."
          fi

      - name: Upload High-Bitrate Farland Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eurveu-farland-video-${{ github.run_id }}
          path: EurVeu-Engine/eurveu_farland_output.mp4
          retention-days: 1
