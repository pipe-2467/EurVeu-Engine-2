name: EurVeu Automatic Ingestion & Render

on:
  repository_dispatch:
    types: [start_eurveu_render]
  workflow_dispatch:
  push:
    paths:
      - 'EurVeu-Engine/inputs/**'

permissions:
  contents: write

jobs:
  process_and_render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ดึงประวัติ Commit ทั้งหมดเพื่อป้องกัน Push Conflict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy soundfile imageio imageio-ffmpeg scipy pillow

      - name: Trigger EurVeu Brain & Render Pipeline
        run: |
          cd EurVeu-Engine
          python eurveu_core.py

      - name: Commit & Push Evolution Memory Update
        run: |
          git config --global user.name "EurVeu-Brain"
          git config --global user.email "eurveu@local.engine"
          git add EurVeu-Engine/eurveu_memory.json
          
          # ตรวจสอบว่ามีความเปลี่ยนแปลงใน memory หรือไม่
          if ! git diff-index --quiet HEAD; then
            git commit -m "[EurVeu Evolution] Processed new input media"
            git pull --rebase origin main  # 🎯 ดึงข้อมูลล่าสุดมาก่อน Push ป้องกัน Conflict
            git push origin main
          else
            echo "No changes in memory to commit."
          fi

      - name: Upload Farland Video Result
        uses: actions/upload-artifact@v4
        with:
          name: eurveu-farland-video
          path: EurVeu-Engine/eurveu_farland_output.mp4
